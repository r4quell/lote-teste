<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login e Cadastro de Lotes</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 40px; }
    .card { max-width: 420px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
    input, select, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; border: 1px solid #cbd5e1; }
    button { background: #2563eb; color: white; cursor: pointer; }
    .message { display: none; margin-top: 12px; color: #166534; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Login</h2>
    <form id="login-form">
      <input id="user-name" type="text" placeholder="Usuário" required />
      <input id="password" type="password" placeholder="Senha" required />
      <button id="login-button" type="submit">Entrar</button>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function (event) {
      event.preventDefault();
      const user = document.getElementById('user-name').value;
      const password = document.getElementById('password').value;
      if (user === 'standard_user' && password === 'secret_sauce') {
        window.location.href = 'inventory.html';
      }
    });
  </script>
</body>
</html>
