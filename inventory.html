<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Lote</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; margin: 0; padding: 40px; }
    .card { max-width: 480px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
    input, select, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; border: 1px solid #cbd5e1; }
    button { background: #16a34a; color: white; cursor: pointer; }
    .message { display: none; margin-top: 12px; color: #166534; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Cadastro de Lote</h2>
    <form id="formulario">
      <input id="numero_lote" type="text" placeholder="Número do lote" required />
      <select id="produto" required>
        <option value="">Selecione um produto</option>
        <option value="Notebook">Notebook</option>
        <option value="Mouse">Mouse</option>
        <option value="Teclado">Teclado</option>
        <option value="Monitor">Monitor</option>
      </select>
      <select id="status" required>
        <option value="">Selecione um status</option>
        <option value="Pendente">Pendente</option>
        <option value="Em Processamento">Em Processamento</option>
        <option value="Concluído">Concluído</option>
      </select>
      <button id="btn_enviar" type="submit">Enviar</button>
    </form>
    <div id="mensagem_sucesso" class="message">Lote cadastrado com sucesso!</div>
  </div>

  <script>
    document.getElementById('formulario').addEventListener('submit', function (event) {
      event.preventDefault();
      document.getElementById('mensagem_sucesso').style.display = 'block';
    });
  </script>
</body>
</html>
